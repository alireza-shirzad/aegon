[package]
name = "akd_core"
version = "0.12.0-pre.12"
authors = ["The Aegon Authors"]
description = "Core cryptographic primitives for the Aegon auditable key directory"
license = "MIT"
edition = "2021"
rust-version = "1.88.0"
keywords = ["key-transparency", "akd", "aegon"]
repository = "https://github.com/alireza-shirzad/aegon"
readme = "../README.md"
# Uncomment for automated building of the protobuf Rust sources. Necessary if the .proto specs change
build = "src/build.rs"

[build-dependencies]
protobuf-codegen = "3"
protobuf-parse = "3"

[features]
# Disable all STD for the crate
nostd = []
# Supported configurations
whatsapp_v1 = ["dep:blake3"]
experimental = ["dep:blake3"]
# Include the VRF verification logic
vrf = ["ed25519-dalek", "curve25519-dalek"]
serde_serialization = ["dep:serde", "dep:serde_bytes", "ed25519-dalek/serde"]
# Parallelize VRF calculations during publish
parallel_vrf = ["tokio"]
# Parallel execution inside the absorbed crypto (KZH-k MSM, etc.)
parallel = [
    "rayon",
    "ark-std/parallel",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-ec/parallel",
    "ndarray/rayon",
]

bench = ["parallel_vrf", "experimental", "vrf", "tokio/rt-multi-thread"]
public_tests = ["dep:paste"]
protobuf = ["dep:protobuf"]

# The workspace pins the arkworks crates with `default-features = false`, so
# nothing turns their `std` on unless a feature asks. `aegon_crypto` reads and
# writes SRS files through `std::io`, which needs `ark-*/std` for the
# `Read`/`Write` blanket impls. Previously this was masked because
# `aegon_crypto` was (incorrectly) gated behind `protobuf`.
std = [
    "ark-std/std",
    "ark-ff/std",
    "ark-ec/std",
    "ark-poly/std",
    "ark-serialize/std",
]

# Default features mix
default = ["vrf", "experimental", "std"]

[dependencies]
## Required dependencies ##
async-trait = "0.1"
curve25519-dalek = { version = "4", optional = true }
ed25519-dalek = { version = "2", features = [
    "digest",
    "legacy_compatibility",
], optional = true }
hex = "0.4"
zeroize = "1"

## Aegon-crypto dependencies (absorbed from arithmetic / subroutines / transcript) ##
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-poly = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
derivative = { workspace = true }
displaydoc = { workspace = true }
merlin = { version = "3", default-features = false }
ndarray = { workspace = true, features = ["serde"] }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true, optional = true }
tracing = { workspace = true }

## Optional dependencies ##
blake3 = { version = "1", optional = true, default-features = false }
protobuf = { version = "3", optional = true }
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_bytes = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
paste = { version = "1", optional = true }

[dev-dependencies]
bincode = "1"
itertools = "0.13"
proptest = "1"
proptest-derive = "0.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
criterion = "0.5"

# To enable the public-tests feature in tests
akd_core = { path = ".", features = ["public_tests"] }

[[bench]]
name = "parallel_vrfs"
harness = false
required-features = ["bench"]

[lints]
workspace = true
