# Configuration for `cross` (https://github.com/cross-rs/cross).
#
# This is only consulted when building inside a cross container — i.e.
# when an operator on macOS runs `./scripts/cluster.sh deploy`. Linux
# hosts build natively with plain `cargo` and ignore this file.
#
# The akd crate's build.rs invokes tonic-build, which shells out to
# `protoc`. Cross's default Ubuntu image doesn't ship it, so install it
# once per container build.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends protobuf-compiler",
]
