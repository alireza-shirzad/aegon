[package]
name = "aegon_crypto"
version = "0.1.0"
authors = ["The Aegon Authors"]
description = "Cryptographic primitives for Aegon: KZH-k polynomial commitments, multilinear arithmetic, transcripts, and ECVRF"
license = "MIT"
edition = "2021"
rust-version = "1.88.0"
keywords = ["key-transparency", "aegon", "polynomial-commitment"]
repository = "https://github.com/alireza-shirzad/aegon"
readme = "../README.md"

[features]
default = ["std"]
# Parallel execution inside the crypto (KZH-k MSM, etc.)
parallel = [
    "rayon",
    "ark-std/parallel",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-ec/parallel",
    "ndarray/rayon",
]
# The workspace pins the arkworks crates with `default-features = false`, so
# nothing turns their `std` on unless a feature asks. SRS files are read and
# written through `std::io`, which needs `ark-*/std` for the `Read`/`Write`
# blanket impls.
std = [
    "ark-std/std",
    "ark-ff/std",
    "ark-ec/std",
    "ark-poly/std",
    "ark-serialize/std",
]
# serde derives on the ECVRF key types.
serde_serialization = ["dep:serde", "ed25519-dalek/serde"]

[dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-poly = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }
derivative = { workspace = true }
displaydoc = { workspace = true }
merlin = { version = "3", default-features = false }
ndarray = { workspace = true, features = ["serde"] }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true, optional = true }
tracing = { workspace = true }
# ECVRF
curve25519-dalek = "4"
ed25519-dalek = { version = "2", features = ["digest", "legacy_compatibility"] }
zeroize = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bincode = "1"
hex = "0.4"
proptest = "1"
proptest-derive = "0.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# Turn on the serde derives for this crate's own tests, so the ECVRF
# prove/verify property test (gated on `serde_serialization`) runs.
aegon_crypto = { path = ".", features = ["serde_serialization"] }

[lints]
workspace = true
